modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "bettervoicechat"
version = "${version}"
displayName = "BetterVoiceChat"
authors = "dext.top"
description = '''TCP voice chat for Minecraft networks. Server-decided voice zones, push-to-talk, mutes and reports.'''
# Optional on both sides: clients join servers without it, servers accept clients without it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.bettervoicechat]]
modId = "minecraft"
# "mandatory" for Forge, "type" for NeoForge; each loader ignores the other key.
mandatory = true
type = "required"
versionRange = "${forgeRange}"
ordering = "NONE"
side = "BOTH"

# BetterVoiceChat 代理端（BungeeCord / Velocity）配置
# 修改后执行 /bvc reload 生效（传输相关的端口设置需要重启）。
config-version: 1

transport:
  # AUTO：先尝试独立连接（A，和 MC 同端口），失败自动改用插件消息（B）
  # STREAM_ONLY：只用 A        PLUGIN_MESSAGE_ONLY：只用 B
  policy: AUTO
  # 客户端建立 A 连接时使用的地址。留空 / 0 = 和玩家连接 MC 时用的地址、端口相同
  stream-host: ""
  stream-port: 0
  # 客户端尝试 A 的超时时间，超时后改用 B（毫秒）
  connect-timeout-ms: 5000
  # 同时存在的"还没完成鉴权"的 A 连接上限，超过直接断开
  max-pending-connections: 256
  # A 连接必须在这个时间内完成鉴权（毫秒）
  auth-timeout-ms: 5000
  # A 连接多久没收到任何数据就断开（秒，客户端每 5 秒发一次心跳）
  idle-timeout-seconds: 30

client:
  # true：没装 Mod 的玩家会被踢出；false：允许进服，只是没有语音
  require-mod: false
  # 进服后多少秒内没检测到 Mod 视为未安装
  mod-detect-timeout-seconds: 10
  download-url: "https://example.com/bettervoicechat"
  # 基岩版（Geyser / Floodgate）玩家装不了 Mod，不强制
  exempt-bedrock: true
  # 不强制装 Mod 的子服（例如登录服）
  require-mod-exempt-servers: []

audio:
  # Opus 码率（bps），由服务器统一下发给所有客户端。16000 对人声足够
  bitrate: 16000
  # 每个听众同时最多接收几路语音，优先级高的优先
  max-streams-per-listener: 8
  # 高优先级的人说话时，其他人被压低多少分贝
  ducking-db: 12.0

priority:
  # 代理端优先级权限：bvc.priority.<数字>，取玩家拥有的最大值（0-255）
  levels: [10, 50, 100, 200]

# 没有安装 BVC 子服插件的子服怎么处理：
# DISABLED：没有语音    FREE：该子服内所有人互相能听到（自由麦）
servers-without-plugin: DISABLED

storage:
  # 目前支持 H2（内置，单文件，无需配置）
  type: H2

# 录音：原样保存经过 BC 转发的语音（Opus，不转码），用于举报回放。
# 请在服务器规则或进服提示里告知玩家语音会被录音。
recording:
  enabled: true
  # 滚动录音的总容量上限（MB），满了从最旧的开始删除。16kbps 下 1024MB 约 125 小时说话量
  max-size-mb: 1024
  # 每个录音文件覆盖多少分钟
  segment-minutes: 60

# 玩家举报：/vreport <玩家> [原因]
reports:
  enabled: true
  # 证据包包含举报前多少秒、举报后多少秒的语音（举报后的部分录完才封包）
  before-seconds: 300
  after-seconds: 120
  # 同一个玩家两次举报之间至少隔多少秒
  cooldown-seconds: 120
  # 证据包保留天数（不占滚动录音的容量，也不会被滚动删除）
  keep-days: 90
  # 举报命令名（第一个是主命令，其余是别名）
  command-aliases: [vreport, voicereport]

# Web 面板：举报处理、回放、搜索录音、禁麦、审计日志
web:
  enabled: true
  # 只监听本机，建议用 Nginx 等反向代理对外提供 HTTPS
  bind: "127.0.0.1"
  # 0 = 随便找一个空闲端口（测试用）
  port: 8790
  # 管理员在浏览器里访问面板用的地址（用于生成 /bvc web 的登录链接），例如 https://voice.example.com
  # 留空 = http://<bind>:<port>
  public-url: ""
  # 登录后多少小时需要重新登录
  session-hours: 12
